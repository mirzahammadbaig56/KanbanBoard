<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="board-head">
        <div class="title-block">
            <h1>Kanban Board</h1>
            <p>drag cards across columns · click + to add</p>
        </div>
        <div class="board-stats" id="boardStats"></div>
    </header>

    <div class="progress-strip">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="searchInput" placeholder="Search cards…">
        </div>
        <div class="filter-chips" id="filterChips">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="high">High</button>
            <button class="chip" data-filter="med">Medium</button>
            <button class="chip" data-filter="low">Low</button>
        </div>
        <button class="add-task-btn" id="addTaskBtn">+ Add task</button>
    </div>

    <main>
        <div class="columns" id="columns"></div>
    </main>

    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-box">
            <h3>New task</h3>
            <label>Title</label>
            <input type="text" id="modalTitle" placeholder="e.g. Set up the login page">
            <label>Description</label>
            <textarea id="modalDescription" placeholder="A bit more detail (optional)…"></textarea>
            <label>Priority</label>
            <select id="modalPriority">
                <option value="low">Low</option>
                <option value="med" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Cancel</button>
                <button class="btn-save" id="modalSave">Add card</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
